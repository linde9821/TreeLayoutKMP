name: Deploy API Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'library/src/**'
      - 'library/build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs sample
        run: ./gradlew :sample:wasmJsBrowserDistribution

      - name: Generate API docs
        run: ./gradlew :library:dokkaGeneratePublicationHtml

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r sample/build/dist/wasmJs/productionExecutable/* _site/
          cp -r library/build/dokka/html _site/api

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
